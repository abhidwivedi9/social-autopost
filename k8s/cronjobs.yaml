# 5 CronJobs, one per daily slot. Times are IST (Asia/Kolkata) using K8s CronJob's
# native timeZone field (GA since k8s 1.27 — GKE Autopilot supports this).
#
# IMAGE: replace `IMAGE_PLACEHOLDER` with your built image, e.g.
#   asia-south1-docker.pkg.dev/terraform-gke-learning/social-autopost/poster:latest
# (build it the same way as your existing GitLab CI -> GKE Autopilot pipeline,
#  and reuse the imagePullSecrets: gitlab-registry-secret fix from that pipeline.)

apiVersion: batch/v1
kind: CronJob
metadata:
  name: autopost-6am-ai-tech
spec:
  schedule: "0 6 * * *"
  timeZone: "Asia/Kolkata"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: gitlab-registry-secret
          containers:
            - name: poster
              image: IMAGE_PLACEHOLDER
              env:
                - name: SLOT
                  value: "6am"
              envFrom:
                - secretRef:
                    name: social-autopost-secrets
